<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project — Will Yang Studio</title><meta name="description" content="A project by Will Yang Studio."><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#F2C534"><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap');:root{--ink:#202020;--brand:#F2C534;--muted:#77746C;--soft:#F6F5F0;--edge:clamp(24px,4.8vw,70px);--gap:clamp(20px,3.4vw,52px)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#fff;font-family:'DM Sans',Arial,sans-serif}.header{padding:48px var(--edge);display:flex;align-items:flex-start;justify-content:space-between}.name,.nav{text-transform:uppercase;font-weight:400}.name{font-size:clamp(22px,2.2vw,35px);line-height:.9;letter-spacing:.045em;white-space:nowrap}.nav{display:flex;gap:clamp(22px,4vw,64px);font-size:clamp(14px,1.25vw,19px);line-height:1}.nav a{position:relative;color:inherit;text-decoration:none}.nav a.active:after{content:'';position:absolute;left:0;right:0;bottom:-10px;height:2px;background:var(--brand)}main{padding:clamp(55px,10vw,150px) var(--edge) 14vw}.hero{height:min(72vw,860px);min-height:330px;background:var(--soft);position:relative;overflow:hidden;display:grid;place-items:center}.object{width:clamp(190px,34vw,500px);height:clamp(150px,28vw,390px);background:var(--tone,#315f45);border-radius:48% 52% 32% 38%;box-shadow:inset -28px -22px 28px #0002,0 25px 35px #0002;transform:rotate(var(--angle,-4deg));position:relative}.object:before{content:'';position:absolute;width:74%;height:17%;left:13%;top:42%;border-radius:50%;background:#ffffff60}.object:after{content:'';position:absolute;width:19%;height:19%;border-radius:50%;right:13%;bottom:18%;background:var(--brand)}.headline{display:grid;grid-template-columns:1fr auto;gap:24px;padding:18px 0 78px;border-bottom:1px solid var(--ink)}h1{font-size:clamp(38px,6.1vw,92px);font-weight:400;letter-spacing:-.055em;line-height:.92;margin:0}.meta{padding-top:8px;text-align:right;font-size:13px;line-height:1.6;color:var(--muted)}.intro{padding:clamp(55px,9vw,130px) 0;max-width:960px;font-size:clamp(25px,3.35vw,52px);line-height:1.06;letter-spacing:-.04em}.project-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-bottom:var(--gap)}.visual{min-height:clamp(260px,36vw,560px);background:var(--soft);overflow:hidden;position:relative;display:grid;place-items:center}.visual.wide{grid-column:1/-1;min-height:clamp(300px,52vw,760px)}.visual .object{transform:rotate(var(--angle,-4deg)) scale(.75)}.visual:nth-child(2) .object{border-radius:8% 47% 20% 46%;background:var(--tone,#315f45)}.visual:nth-child(3) .object{border-radius:50% 50% 8% 8%;background:var(--tone,#315f45)}.caption{max-width:520px;margin:28px 0 clamp(80px,13vw,180px);font-size:clamp(16px,1.5vw,21px);line-height:1.45}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);border-top:1px solid var(--ink);padding-top:20px;margin-bottom:clamp(90px,14vw,200px)}.details h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:400;margin:0 0 10px}.details p{margin:0;font-size:15px;line-height:1.45}.next{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ink);padding-top:22px;text-decoration:none;color:var(--ink);font-size:clamp(20px,2.2vw,30px)}.next span:last-child{width:14px;height:14px;border-radius:50%;background:var(--brand)}@media(max-width:680px){.header{padding-top:30px}.nav{gap:18px;font-size:14px}.headline{grid-template-columns:1fr;padding-bottom:48px}.meta{text-align:left;padding-top:0}.project-grid{grid-template-columns:1fr}.visual.wide{grid-column:auto}.details{grid-template-columns:1fr;gap:28px}}</style></head><body><header class="header"><div class="name">Will Yang Studio</div><nav class="nav"><a class="active" href="index.html">Works</a><a href="news.html">News</a><a href="about.html">About</a></nav></header><main><section class="hero"><i class="object" id="hero-object"></i></section><section class="headline"><h1 id="title"></h1><p class="meta" id="meta"></p></section><p class="intro" id="intro"></p><section class="project-grid"><div class="visual wide"><i class="object" id="v1"></i></div><div class="visual"><i class="object" id="v2"></i></div><div class="visual"><i class="object" id="v3"></i></div></section><p class="caption" id="caption"></p><section class="details"><div><h2>Client</h2><p id="client"></p></div><div><h2>Scope</h2><p>Industrial design<br>CMF direction<br>Production development</p></div><div><h2>Year</h2><p id="year"></p></div></section><a class="next" id="next" href="#"><span>Next project</span><span></span></a></main><script>const names=['Orion Table','Common Chair','Pillow Seat','Onda Cabinet','Haze Mirror','Boo Speaker','Mori Light','Parcel Stool','Tide Vessel','Fold Lamp','Sora Clock','Halo Fan','Cove Storage','Polo Bench','Pebble Radio','Kite Kettle','Mono Tray','Arc Stool','Shift Bottle','Nero Desk','Ridge Chair','Citrus Press','Dune Shelf','Bloom Pot','Cado Lamp','Tempo Table','Nook Bed','Brush Vase','Loop Clock','Melt Console','Mica Chair','Rill Speaker','June Seat','Core Lamp','Drift Shelf','Shell Bowl','Aero Stool','Muse Mirror','Line Cabinet','Oat Table','Faro Light','Wisp Chair','Pond Vessel','Silo Bench','Noma Radio','Tact Lamp','Skein Table','Sage Chair','Bento Tray','Swell Shelf'];const brands=['Mori','Forma','Field Notes','Atelier Uno','Studio Ore','Noma','Bene','Koto','Arc Objects','Lume'];const tones=['#315f45','#346dc7','#bf6f2d','#c39c57','#8da992','#cf7150','#4d6872','#b98564','#765c96'];const p=new URLSearchParams(location.search);let i=Number(p.get('id'));if(!Number.isInteger(i)||i<0||i>=names.length)i=0;const n=names[i],b=brands[i%brands.length],y=2020+i%6,t=tones[i%tones.length],angle=[-4,4,-8,8,0][i%5]+'deg';document.title=n+' — Will Yang Studio';document.querySelector('#title').textContent=n;document.querySelector('#meta').innerHTML=b+'<br>'+y;document.querySelector('#intro').textContent='Designed for '+b+', '+n+' translates an everyday need into a clear, tactile object. The project balances an unexpected silhouette with the practical realities of material, assembly and use.';document.querySelector('#caption').textContent='From the first volume studies to the final prototype, the design was refined through proportion, touch points and a considered manufacturing logic. This is placeholder editorial copy for the future project story.';document.querySelector('#client').textContent=b;document.querySelector('#year').textContent=y;[...document.querySelectorAll('.object')].forEach((el,k)=>{el.style.setProperty('--tone',tones[(i+k)%tones.length]);el.style.setProperty('--angle',angle)});const next=(i+1)%names.length;document.querySelector('#next').href='project.html?id='+next;</script></body></html>
