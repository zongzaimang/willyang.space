<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap');:root{--ink:#202020;--brand:#F2C534;--muted:#77746C;--soft:#F6F5F0;--edge:clamp(24px,4.8vw,70px);--gap:clamp(20px,3.4vw,52px)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#fff;font-family:'DM Sans',Arial,sans-serif}.header{padding:48px var(--edge);display:flex;align-items:flex-start;justify-content:space-between}.name,.nav{text-transform:uppercase;font-weight:400}.name{font-size:clamp(22px,2.2vw,35px);line-height:.9;letter-spacing:.045em;white-space:nowrap}.nav{display:flex;gap:clamp(22px,4vw,64px);font-size:clamp(14px,1.25vw,19px);line-height:1}.nav a{position:relative;color:inherit;text-decoration:none}.nav a.active:after{content:'';position:absolute;left:0;right:0;bottom:-10px;height:2px;background:var(--brand)}main{padding:clamp(55px,10vw,150px) var(--edge) 14vw}.hero{height:min(72vw,860px);min-height:330px;background:var(--soft);position:relative;overflow:hidden;display:grid;place-items:center}.object{width:clamp(190px,34vw,500px);height:clamp(150px,28vw,390px);background:var(--tone,#315f45);border-radius:48% 52% 32% 38%;box-shadow:inset -28px -22px 28px #0002,0 25px 35px #0002;transform:rotate(var(--angle,-4deg));position:relative}.object:before{content:'';position:absolute;width:74%;height:17%;left:13%;top:42%;border-radius:50%;background:#ffffff60}.object:after{content:'';position:absolute;width:19%;height:19%;border-radius:50%;right:13%;bottom:18%;background:var(--brand)}.headline{display:grid;grid-template-columns:1fr auto;gap:24px;padding:18px 0 78px;border-bottom:1px solid var(--ink)}h1{font-size:clamp(38px,6.1vw,92px);font-weight:400;letter-spacing:-.055em;line-height:.92;margin:0}.meta{padding-top:8px;text-align:right;font-size:13px;line-height:1.6;color:var(--muted)}.intro{padding:clamp(55px,9vw,130px) 0;max-width:960px;font-size:clamp(25px,3.35vw,52px);line-height:1.06;letter-spacing:-.04em}.project-grid{di
