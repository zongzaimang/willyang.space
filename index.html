<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Will Yang — Industrial Design</title>
<meta name="description" content="Will Yang 的工业设计作品集。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/sticky-header.css">
<meta name="theme-color" content="#F2C534">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap');
:root{--ink:#202020;--edge:clamp(24px,4.8vw,70px);--gap:clamp(18px,3.5vw,50px)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:'DM Sans',Arial,sans-serif}.header{height:clamp(150px,29vw,290px);padding:48px var(--edge);display:flex;align-items:flex-start;justify-content:space-between}.name,.nav{font-family:'DM Sans',Arial,sans-serif;font-weight:400;text-transform:uppercase}.name{font-size:clamp(22px,2.2vw,35px);line-height:.9;letter-spacing:.045em;white-space:nowrap}.nav{display:flex;gap:clamp(22px,4vw,64px);font-size:clamp(14px,1.25vw,19px);line-height:1;letter-spacing:.005em}.nav a{color:inherit;text-decoration:none}.nav a:hover{opacity:.4}.gallery{padding:0 var(--edge) 5vw;columns:3;column-gap:var(--gap)}.card{break-inside:avoid;margin-bottom:var(--gap);display:block;cursor:pointer;text-decoration:none;color:var(--ink)}.image{--bg:#f3f3f3;position:relative;background:var(--bg);overflow:hidden;isolation:isolate;aspect-ratio:16/9;transition:transform .45s cubic-bezier(.2,.8,.2,1)}.image:after{content:'';position:absolute;right:12px;bottom:12px;width:11px;height:11px;border-radius:50%;background:#202020;opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s}.card:hover .image{transform:scale(1.015)}.card:hover .image:after{opacity:1;transform:scale(1)}.label{padding:11px 1px 0;display:grid;grid-template-columns:1fr auto;grid-template-areas:'project year' 'brand brand';gap:3px 16px;font-size:11px;line-height:1.3;letter-spacing:0}.project{grid-area:project}.year{grid-area:year;color:#737373}.brand{grid-area:brand;color:#737373}.brand sup{font-size:7px;vertical-align:top;margin-left:1px}.shape{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);filter:drop-shadow(0 14px 10px #0002)}.s0 .shape{width:76%;height:14%;background:#315f45;border-radius:50%;box-shadow:inset 0 -7px #153c2c}.s0 .shape:after,.s0 .shape:before{content:'';position:absolute;width:7%;height:360%;bottom:-330%;background:#22513a;border-radius:0 0 12px 12px}.s0 .shape:before{left:20%}.s0 .shape:after{right:20%}.s1 .shape{width:57%;height:55%;background:linear-gradient(120deg,#0b55db 0 37%,#d7caaa 38% 59%,#c68d63 60%);border-radius:40% 48% 32% 29%;transform:translate(-50%,-50%) rotate(-4deg)}.s1 .shape:before{content:'';position:absolute;width:95%;height:24%;background:#c79575;bottom:-23%;left:15%;border-radius:99px}.s2 .shape{width:32%;height:70%;background:#b96112;border-radius:12% 13% 22% 21%;box-shadow:inset -18px -5px 18px #733000}.s2 .shape:after{content:'';position:absolute;width:155%;height:16%;right:-125%;bottom:18%;border-radius:99px;background:#cf7625}.s3 .shape{width:72%;height:45%;background:#c69e58;border-radius:2%;box-shadow:inset 0 -10px #9e7639}.s3 .shape:before{content:'';position:absolute;width:32%;height:70%;left:7%;top:-68%;border-radius:50% 50% 0 0;background:#9acd84;box-shadow:54px 14px #7ab06c,108px 3px #b4d7a8}.s4 .shape{width:50%;height:75%;background:#f2f1ec;border:4px solid #eee;border-radius:46% 46% 5% 5%;box-shadow:inset -20px -10px #d9d9d7}.s4 .shape:after{content:'';position:absolute;width:26%;height:26%;left:11%;top:35%;border-radius:50%;background:#111}.s5 .shape{width:73%;height:42%;background:#d34732;border-radius:50% 44% 36% 48%;box-shadow:inset -10px -12px #9f241b}.s5 .shape:after{content:'';position:absolute;width:31%;height:31%;left:35%;top:35%;border-radius:50%;background:#fbcb4c}.s6 .shape{width:61%;height:66%;background:#dad8d2;border-radius:50% 50% 15% 15%;border:1px solid #aaa}.s6 .shape:after{content:'';position:absolute;width:62%;height:13%;left:19%;top:45%;background:#242424;border-radius:99px}.s7 .shape{width:74%;height:35%;background:#7295a1;border-radius:50% 50% 36% 36%;box-shadow:inset 0 -12px #466b77}.s7 .shape:after{content:'';position:absolute;width:72%;height:16%;left:14%;bottom:-55%;border-radius:0 0 40% 40%;background:#627778}.s8 .shape{width:47%;height:63%;background:#e4c699;border-radius:50% 50% 12% 12%;box-shadow:inset 16px 0 #f2dcbc}.s8 .shape:after{content:'';position:absolute;width:20%;height:20%;left:40%;top:41%;border-radius:50%;background:#d5694d}.side{position:fixed;right:2.8vw;top:46%;writing-mode:vertical-rl;display:flex;gap:19px;font-size:12px;letter-spacing:.1em;z-index:2}.side a{color:inherit;text-decoration:none}.loader{height:70px;display:flex;justify-content:center;align-items:center;text-transform:uppercase;font-size:10px;letter-spacing:.15em;opacity:.5}@media(max-width:760px){.header{height:150px;padding-top:30px}.nav{gap:18px;font-size:14px}.gallery{columns:2}.side{display:none}.label{font-size:9px}.brand sup{font-size:6px}}@media(max-width:420px){.gallery{columns:1}.header{height:130px}.name{font-size:22px}.nav{font-size:12px;gap:13px}}
</style>
<style>.side{right:2.4vw;top:42%;gap:16px;align-items:center}.side a{width:20px;height:20px;display:grid;place-items:center;font-family:Arial,sans-serif;font-size:0;font-weight:700;letter-spacing:0;writing-mode:horizontal-tb;transition:transform .2s,opacity .2s}.side a:hover{transform:scale(1.18);opacity:.55}.side a:before{font-size:15px;line-height:1}.side .behance:before{content:'Bē';font-size:14px}.side .pinterest:before,.side .xiaohongshu:before,.side .puxiang:before{content:none}.brand-icon{display:block;width:16px;height:16px;object-fit:contain}.puxiang .brand-icon{border-radius:4px}.side .email:before{content:'✉';font-size:16px;font-weight:400}.load-zone{min-height:310px;display:flex;align-items:center;justify-content:center;padding:70px 0}.more{width:116px;height:116px;border:1px solid #202020;border-radius:50%;background:#fff;font-family:'DM Sans',Arial,sans-serif;font-size:13px;font-weight:400;letter-spacing:.04em;cursor:pointer;transition:color .25s,background .25s,transform .25s}.more:hover{background:#202020;color:#fff;transform:scale(1.06)}.site-footer{display:none;height:440px;overflow:hidden;position:relative;justify-content:center;align-items:flex-end;text-align:center}.site-footer.show{display:flex}.footer-arc{position:absolute;width:min(780px,78vw);height:min(390px,39vw);min-height:280px;border:1px solid #202020;border-bottom:0;border-radius:50% 50% 0 0;bottom:0;left:50%;transform:translateX(-50%)}.footer-content{position:relative;z-index:1;padding-bottom:54px}.footer-nav{display:flex;justify-content:center;gap:clamp(20px,3vw,43px);font-size:13px;text-transform:uppercase}.footer-nav a{color:inherit;text-decoration:none}.footer-content p{margin:47px 0 0;font-size:11px}@media(max-width:760px){.load-zone{min-height:230px}.more{width:92px;height:92px}.site-footer{height:300px}.footer-arc{width:120vw;height:250px}.footer-content{padding-bottom:34px}.footer-content p{margin-top:30px}}</style>
</head>
<body>
<header class="header">
<a class="name" href="index.html" aria-label="Will Yang Studio home" style="color:inherit;text-decoration:none">Will Yang Studio</a>
<nav class="nav">
<a href="#work">Work</a>
<a href="#news">News</a>
<a href="#about">About</a>
</nav>
</header>
<aside class="side" aria-label="Social links">
<a class="behance" href="#" aria-label="Behance" title="Behance">Behance</a>
<a class="pinterest" href="#" aria-label="Pinterest" title="Pinterest">
<img class="brand-icon" src="https://cdn.simpleicons.org/pinterest/202020" alt="">
</a>
<a class="xiaohongshu" href="#" aria-label="小红书" title="小红书">
<img class="brand-icon" src="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/xiaohongshu/default.svg" alt="">
</a>
<a class="puxiang" href="#" aria-label="普象" title="普象">
<img class="brand-icon" src="https://is1-ssl.mzstatic.com/image/thumb/Purple116/v4/6d/0d/1a/6d0d1a4c-3e47-7399-b303-076830b3a2ea/AppIcon-1x_U007emarketing-0-7-0-0-85-220.png/1200x630wa.png" alt="">
</a>
<a class="email" href="mailto:hello@wenyang.design" aria-label="Email" title="Email">Email</a>
</aside>
<main class="gallery" id="work" aria-label="作品项目">
</main>
<section class="load-zone" id="load-zone">
<button class="more" id="more" type="button">MORE</button>
</section>
<footer class="site-footer" id="footer">
<div class="footer-arc">
</div>
<div class="footer-content">
<nav class="footer-nav">
<a href="#work">Work</a>
<a href="#news">News</a>
<a href="#about">About</a>
</nav>
<p>Copyright © Will Yang Studio</p>
</div>
</footer>
<script>
const names=['Orion Table','Common Chair','Pillow Seat','Onda Cabinet','Haze Mirror','Boo Speaker','Mori Light','Parcel Stool','Tide Vessel','Fold Lamp','Sora Clock','Halo Fan','Cove Storage','Polo Bench','Pebble Radio','Kite Kettle','Mono Tray','Arc Stool','Shift Bottle','Nero Desk','Ridge Chair','Citrus Press','Dune Shelf','Bloom Pot','Cado Lamp','Tempo Table','Nook Bed','Brush Vase','Loop Clock','Melt Console','Mica Chair','Rill Speaker','June Seat','Core Lamp','Drift Shelf','Shell Bowl','Aero Stool','Muse Mirror','Line Cabinet','Oat Table','Faro Light','Wisp Chair','Pond Vessel','Silo Bench','Noma Radio','Tact Lamp','Skein Table','Sage Chair','Bento Tray','Swell Shelf'];
const brands=['Mori','Forma','Field Notes','Atelier Uno','Studio Ore','Noma','Bene','Koto','Arc Objects','Lume'];
const gallery=document.querySelector('.gallery'),more=document.querySelector('#more'),loadZone=document.querySelector('#load-zone'),footer=document.querySelector('#footer');let loaded=0;function add(amount){const end=Math.min(loaded+amount,names.length);for(let i=loaded;i<end;i++){let shape=i%9,a=document.createElement('a');a.className='card s'+shape;a.href='project.html?id='+i;a.setAttribute('aria-label','View '+names[i]);a.innerHTML=`<div class="image">
<i class="shape">
</i>
</div>
<div class="label">
<span class="project">${names[i]}</span>
<span class="year">202${i%6}</span>
<span class="brand">${brands[i%brands.length]}<sup>®</sup>
</span>
</div>`;gallery.append(a)}loaded=end;if(loaded===names.length){loadZone.remove();footer.classList.add('show')}}add(30);more.addEventListener('click',()=>add(30));
</script>
<style>:root{--brand:#F2C534;--brand-deep:#C88E00;--paper:#FFFFFF;--soft:#F6F5F0;--muted:#77746C}.image:after{background:var(--brand)}.year,.brand{color:var(--muted)}.more{border-color:var(--ink);background:var(--paper)}.more:hover{background:var(--brand);border-color:var(--brand);color:var(--ink)}.nav a{position:relative}.nav a.active:after{content:'';position:absolute;left:0;right:0;bottom:-10px;height:2px;background:var(--brand)}</style>
<script>const links=[['Works','index.html'],['News','news.html'],['About','about.html']];document.querySelectorAll('.nav,.footer-nav').forEach(nav=>{nav.querySelectorAll('a').forEach((a,i)=>{a.textContent=links[i][0];a.href=links[i][1];a.classList.toggle('active',i===0)})});document.querySelectorAll('.card').forEach((card,i)=>{card.href='project.html?id='+i;card.setAttribute('aria-label','View '+names[i])});</script>
<script src="/sticky-header.js"></script>
</body>
</html>
